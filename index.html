/* mini calendar under the Day view */
.sch-mini{background:var(--card);border-radius:var(--r);padding:14px 16px 16px;margin-bottom:20px;max-width:420px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mini-h b{font-size:15px}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini-wd{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.mini-d{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:10px}
.mini-d .n{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.mini-d.out{opacity:.35}
.mini-d.today .n{color:var(--accent);font-weight:800}
.mini-d.sel .n{background:var(--accent);color:#fff}
.mini-d:hover .n{background:var(--bg)}
.mini-d.sel:hover .n{background:var(--accent)}
.mini-d .dots{display:flex;gap:2px;height:5px}
.mini-d .dots i{width:5px;height:5px;border-radius:50%}
@media (max-width:899px){.sch-mini{max-width:none}}


/* tools: focus stats */
.fstat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fs3{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.fs3 span{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fs3 b{font-family:Lalezar,Inter,sans-serif;font-weight:400;font-size:26px;line-height:1.2}
.fs3 small{font-size:12px;color:var(--muted)}
.fbars{display:flex;align-items:flex-end;gap:6px;height:130px}
.fbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.fbar i{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent-soft);min-height:3px}
.fbar.today i{background:var(--accent)}
.fbar em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.fbar span{font-size:11px;color:var(--muted)}
.fsec{display:grid;grid-template-columns:160px 1fr 70px;align-items:center;gap:12px;padding:5px 0}
.fsec .fsn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsec .bar{margin:0}
.fsec b{text-align:right;font-size:14px}
/* tools: prayer */
.prgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 6px}
.prc{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.prc .prar{font-family:Amiri,serif;font-size:20px;line-height:1.3}
.prc b{font-size:14px}
.prc .prt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prc .prs{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px}
.prc.s{color:#fff}.prc.s .prt,.prc.s .prs{color:rgba(255,255,255,.9)}
.prweek{display:flex;gap:8px}
.prday{flex:1;background:var(--bg);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.prday.today{outline:2px solid var(--accent)}
.prday .pdw{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.prday i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.prset{margin-top:12px}
.prset summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.prset .row{margin-top:10px}
.prset input[type=text]{min-width:120px}
/* tools: countdowns */
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-left:4px;background:transparent}
.syncdot.synced{background:#3f9a78}.syncdot.syncing{background:#d9a33a}.syncdot.error{background:#d93c3c}.syncdot.out{background:rgba(255,255,255,.25)}
.gbtn{display:inline-flex;align-items:center;gap:10px}
.glogo{display:inline-flex;background:#fff;border-radius:50%;padding:3px}
.accwho{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.accwho img{width:40px;height:40px;border-radius:50%}
.accwho div{display:flex;flex-direction:column}
.accrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.accrow > div{display:flex;flex-direction:column;gap:2px}
.accask,.accrules{background:color-mix(in srgb,var(--accent) 10%,var(--bg));border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.accrules ol{margin:0;padding-left:20px;font-size:14px;line-height:1.6}
.rulescode{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;overflow:auto;white-space:pre;margin:0}
.accapi{margin:4px 0 8px;font-size:14px}.accapi summary{cursor:pointer;color:var(--muted);font-weight:600}.accapi ol{line-height:1.7;padding-left:20px}
.drivechip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,#4285f4 15%,var(--bg));color:#4285f4;text-decoration:none}
.drivechip.off{background:var(--bg);color:var(--muted)}
.fitweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 4px}
.fitday{background:var(--bg);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:58px;border:1.5px solid transparent}
.fitday span{font-size:12px;color:var(--muted);font-weight:600}
.fitday.today{border-color:var(--accent)}
.fitday.on{background:color-mix(in srgb,#3f9a78 14%,var(--bg))}
.fitdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.fitdots i{width:12px;height:12px;border-radius:50%}
.fittype{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--k);border:1.5px solid var(--k)}
.fitline{width:100%;height:auto;max-height:200px;margin:8px 0}
.fitline polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.fitline circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.fitline text{font-size:11px;fill:var(--muted);text-anchor:middle}
.urges{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.urge{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;border:1.5px solid;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.urge b{font-size:26px;font-family:var(--serif,inherit)}
.urge span{font-size:13px;font-weight:600}
.urge.ok{border-color:#3f9a78}.urge.ok b{color:#3f9a78}
.urge.bad{border-color:#d93c3c}.urge.bad b{color:#d93c3c}
.fvsbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line)}
.fvsbar i.f{background:#3f9a78}.fvsbar i.s{background:#d93c3c}
.fvsl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:6px}
.fvsl .f{color:#3f9a78}.fvsl .s{color:#d93c3c}
.fowed{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.fowed b{display:block;font-size:28px}
.fcalhead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.fcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.fdow{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.fday{position:relative;aspect-ratio:1/1;border-radius:12px;border:1.5px solid transparent;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;max-height:64px}
.fday b{font-size:15px}
.fday small{font-size:10px;color:var(--muted)}
.fday.sunnah{border-color:#d9a33a}
.fday.ramadan{border-color:#6c9bd2;background:color-mix(in srgb,#6c9bd2 12%,var(--bg))}
.fday.eid{opacity:.45;border-style:dashed;border-color:var(--muted)}
.fday.fast{background:#3f9a78;color:#fff;border-color:#3f9a78}
.fday.qada{background:#7a5cc4;color:#fff;border-color:#7a5cc4}
.fday.fast small,.fday.qada small{color:rgba(255,255,255,.8)}
.fday.today{box-shadow:0 0 0 2px var(--accent)}
.fday.future{opacity:.85}
.fkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:10px 0 4px}
.fkey span{display:flex;align-items:center;gap:5px}
.fk{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid transparent}
.fk.fast{background:#3f9a78}.fk.qada{background:#7a5cc4}.fk.sunnah{border-color:#d9a33a}.fk.ramadan{border-color:#6c9bd2;background:color-mix(in srgb,#6c9bd2 20%,transparent)}.fk.eid{border:1.5px dashed var(--muted)}
.muhq{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.muhq b{font-size:14px}
.muhlast{background:color-mix(in srgb,var(--accent) 12%,var(--bg));border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;margin:8px 0}
.muhpast{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:8px}
.muhpast summary{cursor:pointer;font-weight:700}
.muhpast .slmore div{background:var(--card)}
.muhpq{display:block;font-size:13px;margin-top:10px}
.slform{align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sllab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.sllab select{min-width:130px}
.slsave{display:flex;align-items:center;gap:10px;margin-left:auto}
.slprev{font-weight:700;font-size:14px}
.slbars{position:relative;display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;margin:6px 0 10px}
.slbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.slbar i{display:block;width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:var(--line);min-height:4px}
.slbar i.ok{background:#3f9a78}.slbar i.mid{background:#d9a33a}.slbar i.low{background:#d93c3c}
.slbar em{font-style:normal;font-size:12px;font-weight:700}
.slbar span{font-size:12px;color:var(--muted)}
.slbar.today span{color:var(--accent);font-weight:700}
.sltarget{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in srgb,var(--muted) 60%,transparent);pointer-events:none}
.sltarget span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);font-weight:700}
.slmore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slmore div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.slmore span{font-size:12px;color:var(--muted)}
.slmore b{font-size:15px}
.slrec li{gap:14px}
.slrec .slrd{min-width:110px;font-weight:600}
.slrec li b{margin-left:auto}
@media (max-width:640px){.slmore{grid-template-columns:repeat(2,1fr)}.slsave{margin-left:0}}
.cdnote{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.cdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px}
.cd{position:relative;background:var(--bg);border-radius:16px;padding:14px;border-top:4px solid var(--k);display:flex;flex-direction:column;gap:2px}
.cd .cdk{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--k)}
.cd .cdn{font-family:Lalezar,Inter,sans-serif;font-size:44px;line-height:1}
.cd .cdu{font-size:12px;color:var(--muted)}
.cd b{margin-top:6px}
.cd .cdd{font-size:12px;color:var(--muted)}
.cd .iconbtn{position:absolute;top:8px;right:8px}
.cd.soon .cdn{color:var(--k)}
.cd.past{opacity:.55}
.cdstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cdchip{border:0;background:var(--card);border-left:4px solid var(--k);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:8px;color:var(--ink)}
.cdchip b{font-family:Lalezar,Inter,sans-serif;font-weight:400;font-size:20px}
.cdchip.soon b{color:var(--k)}
.cdchip span{font-size:14px;font-weight:600}
@media (max-width:899px){.prgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.prc{padding:10px 2px}.prc .prar{font-size:16px}.prc .prs{display:none}.fsec{grid-template-columns:110px 1fr 56px}.fs3 b{font-size:20px}}


/* advice & notes */
.nadd{background:var(--bg);border-radius:16px;padding:12px;margin-bottom:12px}
.nadd textarea{background:var(--card);min-height:70px;margin-bottom:8px}
.nadd .row input[type=text]{background:var(--card)}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ncard{background:var(--bg);border-radius:16px;padding:14px 14px 8px;display:flex;flex-direction:column;border:1.5px solid transparent}
.ncard.pin{border-color:var(--accent)}
.ncard.adv{border-left:4px solid var(--accent)}
.ncard .ntext{margin:0 0 8px;white-space:pre-wrap;line-height:1.55;font-size:15px;flex:1}
.ncard.adv .ntext{font-style:italic}
.ncard textarea{background:var(--card);min-height:90px}
.ncard input[type=text]{background:var(--card)}
.nmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.nmeta .nfrom{font-weight:700;color:var(--ink)}
.nmeta .iconbtn{padding:4px}


.goals.earn{grid-template-columns:repeat(2,1fr)}
@media (max-width:899px){.goals.earn{grid-template-columns:1fr}}

.goal .bar{background:var(--card)}

.ipswitch{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ipswitch.on{color:var(--accent)}
.ipswitch .switch{width:40px;height:23px}.ipswitch .switch::after{width:17px;height:17px}.ipswitch .switch.on::after{left:20px}


.sch-fixhint{color:var(--muted);font-size:12px}
.sch-fixtag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.sch-fixnote{margin:-6px 0 18px}
.sch-line2 .switch{flex:none}


/* calendar section under every schedule view */
.sch-calsec{background:var(--card);border-radius:var(--r);padding:20px 20px 18px;margin-bottom:20px}
.sch-calsec .sch-calh{margin-bottom:14px}
.sch-calhead{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.panel.sch-plan,.panel.sch-calsec{padding:20px 20px 18px;margin-bottom:20px}
.panel.sch-plan > .phead,.panel.sch-calsec > .phead{margin-bottom:14px}
.panel.sch-plan.collapsed > .phead,.panel.sch-calsec.collapsed > .phead{margin-bottom:0}
.sch-views.sm{margin-bottom:12px;padding:4px}
.sch-views.sm button{padding:6px 12px;font-size:13px;white-space:nowrap}
.sch-calnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sch-calnav b{flex:1;text-align:center;font-size:15px}
.sch-dayev.full{max-width:640px}
.calcols{margin-bottom:0}
.sch-calrow{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-items:start}
.sch-calsec .sch-mini{background:none;padding:0;margin:0;max-width:none}
.sch-dayev{display:flex;flex-direction:column;gap:8px}
.sch-dayev .dev-h{font-size:16px;margin-bottom:2px}
.sch-dayev .sch-cempty{text-align:left;margin:4px 0}
.dev-add{background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.dev-add input[type=text]{background:var(--card)}
.dev-add input[type=time]{padding:9px 12px;border:1px solid var(--line);border-radius:999px;font:inherit;background:var(--card);color:var(--ink)}
.dev-allday{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dev-add .linkbtn{align-self:flex-start}
@media (max-width:899px){.sch-calrow{grid-template-columns:1fr}}


.sch-hkind{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.sch-cols.multi .sch-citem .cname{white-space:normal;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}


/* university modules */
.modcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 12px}
.modcard{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--mc);color:var(--ink)}
.modcard.on{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 35%,transparent)}
.modcard b{font-size:14px;line-height:1.3}
.modcard .stack{margin:0;height:8px}
.modcard span{font-size:12px;color:var(--muted);font-weight:600}
li.tmod{border:0;padding:20px 0 4px;font-weight:800;font-size:15px;color:var(--mc)}
li.tmod span:not(.chev){border-left:4px solid var(--mc);padding-left:10px}
li.ttopic{padding-top:10px}
li.ttopic small{margin-left:auto}
li.colh{cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;flex-wrap:nowrap;text-align:left}
li.colh > span:not(.chev){text-align:left}
li.colh .chev{display:inline-flex;flex:none;transition:transform .2s;opacity:.7}
li.colh .chev .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2}
li.colh.shut .chev{transform:rotate(-90deg)}
li.tmod.colh span:not(.chev){border-left:0;padding-left:0;flex:1;min-width:0}
li.tmod.colh small{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
li.colh:hover span{opacity:.85}
select.topsel{font-size:13px;padding:7px 10px;max-width:260px}
select.topsel.add{max-width:240px}
select.topsel.row{font-size:12px;padding:3px 8px;border-radius:8px;background:transparent;max-width:220px}


/* university years */
.subtabs.yeartabs{margin:0 0 10px}
.subtabs.yeartabs button.on{background:var(--accent);color:#fff}
.modedit{margin:6px 0 4px;display:flex;flex-direction:column;gap:6px}
.modedit .linkbtn{align-self:flex-start}
.modedit .bulkbox textarea{min-height:90px}
.modrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.modrow i{width:10px;height:10px;border-radius:50%}
.modrow span{flex:1}

.mtgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))!important}
.mtgrid .hch{justify-content:flex-start;align-items:flex-start}
.mtgrid .hch span{font-size:13px;line-height:1.35}

/* finance pots */
.potsum{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:14px}
.psum{background:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.psum span{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.psum b{font-family:Lalezar,Inter,sans-serif;font-weight:400;font-size:34px;line-height:1.1}
.psum.need b{color:var(--accent)}
.psum small{font-size:12px;color:var(--muted)}
.potgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pot{background:var(--bg);border-radius:16px;padding:14px;border-top:4px solid var(--pc);display:flex;flex-direction:column;gap:2px}
.poth{display:flex;justify-content:space-between;align-items:center}
.poth b{font-size:15px}
.potbal{font-family:Lalezar,Inter,sans-serif;font-size:32px;line-height:1.1;color:var(--pc)}
.potbal.neg{color:#d93c3c}
.potsub{font-size:11px;color:var(--muted);margin-bottom:6px}
.pot .meta{margin:4px 0 0;font-size:12px}
.pot .bar i{background:var(--pc)}
.goal .bar{background:var(--card)}
.pot .bar{background:var(--card)}
.potedit{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.potedit input,.potedit select{background:var(--card);min-width:0;width:100%}
.addpot{border:2px dashed var(--line);border-top:2px dashed var(--line);align-items:center;justify-content:center;flex-direction:row;gap:8px;color:var(--muted);font-weight:700;min-height:120px}
.addpot:hover{border-color:var(--accent);color:var(--accent)}
select.potsel{font-size:13px;padding:7px 10px;max-width:200px}
li.mrow2 select.potsel{font-size:12px;padding:3px 8px;border-radius:8px;background:transparent}
.potsplit{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pottag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc)}
li.mrow2 .label{display:flex;flex-direction:column}
@media (max-width:899px){.potsum{grid-template-columns:1fr}}


/* adhkar */
.duaform{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.duaform textarea{min-height:64px;resize:vertical}
.duaform .duaar{font-family:Amiri,serif;font-size:20px;line-height:1.8}
.duaform .row{flex-wrap:wrap}
.duaform select,.duaform input{flex:1;min-width:140px}
.duacat{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.duaen{white-space:pre-wrap;color:var(--ink,inherit)}
.ghost.sm,.cta.sm{padding:6px 12px;font-size:13px}
.adtabs{margin:6px 0 12px;flex-wrap:wrap}
.adhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.adtitle{font-family:Amiri,serif;font-size:26px;direction:rtl;line-height:1.3}
.adprog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:10px}
.adlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.aditem{display:block;background:var(--bg);border-radius:16px;padding:14px 16px;border:1.5px solid transparent}
.aditem.done{background:color-mix(in srgb,#3f9a78 12%,var(--bg));border-color:color-mix(in srgb,#3f9a78 40%,transparent)}
.adtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.adno{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.adx{margin-left:auto;background:var(--ink,#1c2b3a);color:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.adtext{font-family:Amiri,"Scheherazade New",serif;font-size:24px;line-height:2;direction:rtl;text-align:right}
.adlist.big .adtext{font-size:31px}
.adbas{font-size:20px;text-align:center;opacity:.8}
.adlist.big .adbas{font-size:25px}
.adq+.adq{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--muted) 40%,transparent)}
.adqref{font-size:12px;color:var(--muted);font-weight:600}
.aden{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.adlist.noen .aden{display:none}
.adfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.adsrc{font-size:12px;font-style:italic;color:var(--muted);flex:1;min-width:180px;line-height:1.45}
.adgrade{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.35;border:1px solid transparent}
.adgrade.g-s{background:rgba(46,160,90,.14);color:#2e8b57;border-color:rgba(46,160,90,.3)}
.adgrade.g-h{background:rgba(60,130,200,.13);color:#3a7bbf;border-color:rgba(60,130,200,.3)}
.adgrade.g-d{background:rgba(220,150,40,.15);color:#b7791f;border-color:rgba(220,150,40,.35)}
.adgrade.g-m{background:rgba(210,60,60,.14);color:#c53030;border-color:rgba(210,60,60,.35)}
.adgrade.g-x{background:transparent;color:var(--muted);border-color:var(--line,rgba(128,128,128,.3))}
.adqtr{font-size:11px;color:var(--muted);margin:4px 0 0}
.adnote{font-size:13px;margin:6px 0 0;padding-left:10px;border-left:3px solid var(--accent);color:var(--ink,inherit)}
.adcount{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;min-width:120px;cursor:pointer}
.adcount.done{background:#3f9a78;border-color:#3f9a78;color:#fff}
.adsub{border-bottom:0;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-radius:999px;padding:8px 16px;font-weight:700;margin-top:6px}
.adsubar{font-family:Amiri,serif;font-size:19px;direction:rtl}
.adend{margin-top:14px}
.adgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.adcard{background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid transparent}
.adcard.now{border-color:var(--accent)}
.adcard.on{background:color-mix(in srgb,#3f9a78 16%,var(--bg))}
.adcard .adar{font-family:Amiri,serif;font-size:22px;direction:rtl;text-align:right;line-height:1.5}
.adcard b{font-size:15px}
.adcard .adwhen{font-size:12px;color:var(--muted)}
.adcard.now .adwhen{color:var(--accent);font-weight:700}
.adcard .row{margin-top:8px}
.adcard .ghost svg.ic{width:15px;height:15px}
.adsalah{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adpill{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.adpill .bx{width:16px;height:16px;border-radius:5px;border:2px solid var(--muted);display:inline-flex}
.adpill.on{background:#3f9a78;border-color:#3f9a78;color:#fff}
.adpill.on .bx{border-color:#fff;background:#fff}
.prday .pds{font-size:10px;color:var(--muted);font-weight:700}
.adbook{background:var(--bg);border-radius:16px;padding:14px;margin-top:10px;border-left:4px solid var(--line)}
.adbook.have{border-left-color:var(--accent)}
.adbook .meta{margin:4px 0 0}
.adparts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adpart{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:baseline}
.adpart small{color:var(--muted);font-weight:500}
.adpart:hover{border-color:var(--accent)}
.pdfpage{color:rgba(255,255,255,.7);font-size:13px;font-weight:700}
@media (max-width:899px){.adgrid{grid-template-columns:1fr}}

[hidden]{display:none!important}

/* ===== mobile: sidebar becomes a bottom bar ===== */
@media (max-width:899px){
  header{position:sticky;top:0;bottom:auto;width:auto;flex-direction:row;align-items:center;padding:14px 18px;gap:0;overflow:visible}
  .brand .t1{font-size:26px}.brand .t2{font-size:9px;margin-top:4px}
  nav{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;background:var(--hdr);
      padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);z-index:50;
      -webkit-transform:translateZ(0);transform:translateZ(0)}
  nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;border-left:0;border-top:2px solid transparent;flex:1;align-items:center}
  nav button.on{border-top-color:var(--accent)}
  nav button small,nav button.child,nav .spacer{display:none}
  .side-one{display:none}
  main{margin-left:0;padding:20px 16px 110px}
  .pagehead{min-height:0;padding:22px 18px 24px}.ph-big{font-size:44px;margin-top:40px}.bgl{font-size:150px}
  .timer{font-size:84px}
  .panel{padding:20px 18px}
}

    for (var i = 6; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); var dk = dkey(d), l = state.adhkarLog[dk] || {};
      var col = el("div", "prday" + (dk === tk ? " today" : "")); col.appendChild(el("span", "pdw", d.toLocaleDateString(undefined, { weekday:"short" })));
      [["morning","#d9a33a"],["evening","#6c9bd2"],["sleep","#c58af9"]].forEach(function (x) { var dot = el("i"); if (l[x[0]]) dot.style.background = x[1]; dot.title = x[0]; col.appendChild(dot); });
      var sc = ["fajr","dhuhr","asr","maghrib","isha"].filter(function (k) { return l[k]; }).length; col.appendChild(el("small", "pds", sc + "/5"));
      wk.appendChild(col); }
    p.appendChild(wk);
    p.appendChild(el("p", "meta", "Dots: morning · evening · before sleep. The number is how many after-ṣalāh adhkār you did."));
    app.appendChild(p); makeCollapsible("ad-today");
    renderAdhkarReader(log);

    renderMyDuas();
  }

  function render(){
    app.innerHTML = "";
    renderNav();
    var t = state.tab;
    if (t === "home") renderHome();
    else if (t === "schedule") renderSchedule();
    else if (t === "todo") renderTodo();
    else if (t === "islamic") renderIslamic();
    else if (t === "tools") renderTools();
    else if (t === "settings") renderSettings();
    else renderTasks(t);
    syncArabic();
  }
  window.addEventListener("resize", function () { renderNav(); });
  render();
})();
</script>
</body>
</html>
